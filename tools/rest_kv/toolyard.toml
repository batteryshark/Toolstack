# Single source of truth for the kv tool: a REST-compliant key-value store exposed as a
# verb-as-op passthrough. The broker reads only the non-secret fields (id, type, operations,
# port) and forwards the caller's <verb> <path> straight through to this service.

id = "kv"
type = "rest"
description = "A small REST-compliant key-value store, behind the broker as a verb-as-op passthrough (the type=\"rest\" template)."

[entrypoint]
command = "python3 app.py"   # process runner (dev/CI)
port = 4621
# production (docker runner): build the Dockerfile here, or set an image:
# image = "toolstack-kv"

# A rest tool's operations ARE the HTTP verbs. risk is DERIVED from the verb (GET=read,
# POST/PUT/PATCH=write, DELETE=destructive) so a DELETE can't be mislabelled, and every verb
# takes the same {path, body, query} passthrough shape. Declare only the verbs you want to
# expose; an undeclared verb has no op, so policy can't allow it. The agent calls e.g.
#   kv.GET    {path = "/items/foo"}
#   kv.POST   {path = "/items", body = {key = "foo", value = 1}}
#   kv.PUT    {path = "/items/foo", body = {value = 2}}
#   kv.DELETE {path = "/items/foo"}

[[operations]]
name = "GET"
risk = "read"
description = "Read a key (/items/<key>) or list all keys (/items)."
args = [ { name = "path", type = "string", required = true, description = "request path on the tool, e.g. /items/42" }, { name = "body", type = "object", required = false, description = "JSON request body (POST/PUT/PATCH)" }, { name = "query", type = "object", required = false, description = "query-string parameters" }, { name = "headers", type = "object", required = false, description = "request headers to forward (broker reserves X-Toolstack-*)" } ]

[[operations]]
name = "POST"
risk = "write"
description = "Create a new item: body { key, value }. 409 if the key exists."
args = [ { name = "path", type = "string", required = true, description = "request path on the tool, e.g. /items/42" }, { name = "body", type = "object", required = false, description = "JSON request body (POST/PUT/PATCH)" }, { name = "query", type = "object", required = false, description = "query-string parameters" }, { name = "headers", type = "object", required = false, description = "request headers to forward (broker reserves X-Toolstack-*)" } ]

[[operations]]
name = "PUT"
risk = "write"
description = "Upsert /items/<key> from body { value }."
args = [ { name = "path", type = "string", required = true, description = "request path on the tool, e.g. /items/42" }, { name = "body", type = "object", required = false, description = "JSON request body (POST/PUT/PATCH)" }, { name = "query", type = "object", required = false, description = "query-string parameters" }, { name = "headers", type = "object", required = false, description = "request headers to forward (broker reserves X-Toolstack-*)" } ]

[[operations]]
name = "PATCH"
risk = "write"
description = "Update an existing /items/<key> from body { value }. 404 if absent."
args = [ { name = "path", type = "string", required = true, description = "request path on the tool, e.g. /items/42" }, { name = "body", type = "object", required = false, description = "JSON request body (POST/PUT/PATCH)" }, { name = "query", type = "object", required = false, description = "query-string parameters" }, { name = "headers", type = "object", required = false, description = "request headers to forward (broker reserves X-Toolstack-*)" } ]

[[operations]]
name = "DELETE"
risk = "destructive"
description = "Delete /items/<key>. 404 if absent."
args = [ { name = "path", type = "string", required = true, description = "request path on the tool, e.g. /items/42" }, { name = "body", type = "object", required = false, description = "JSON request body (POST/PUT/PATCH)" }, { name = "query", type = "object", required = false, description = "query-string parameters" }, { name = "headers", type = "object", required = false, description = "request headers to forward (broker reserves X-Toolstack-*)" } ]

# Like the other templates, this demo ships with NO secrets, and the optional broker_secret
# defense-in-depth check works the same way (see app.py verify_broker).
