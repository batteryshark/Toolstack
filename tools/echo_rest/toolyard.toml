# Single source of truth for the echo tool.
# The broker reads only the non-secret fields (id, type, operations, port).
# The toolyard additionally reads [entrypoint] and [[secrets]].

id = "echo"
type = "rest"

[entrypoint]
command = "python3 app.py"   # process runner (dev/CI)
port = 4601
# production (docker runner): build the Dockerfile here, or set an image:
# image = "toolstack-echo"

# 'risk' below is descriptive metadata shown during discovery. It does NOT decide
# whether a call needs approval — that is the per-caller POLICY (allow / review /
# deny), which an operator sets with `brokerctl`. See broker/policy.py.

[[operations]]
name = "say"
risk = "read"
description = "Echo the given arguments back."
args = [ { name = "m", type = "string", required = false, description = "any value to echo back" } ]

[[operations]]
name = "whoami"
risk = "read"
description = "Return the calling caller name and broker request id."
args = []

[[operations]]
name = "secret_status"
risk = "read"
description = "Report whether the tool can read its api_key secret (length only, never the value)."
args = []

# This demo tool ships with NO secrets, so it starts cleanly on any backend (file / vault /
# infisical) without provisioning anything first — its `secret_status` op just reports "no api_key".
# To demo secret resolution, declare one here AND provision API_KEY in your backend:
#   [[secrets]]
#   name = "api_key"     # readable by the tool at $TOOLSTACK_SECRETS_DIR/api_key
#   field = "API_KEY"    # field looked up in the secret backend

# Optional defense in depth (off by default — see app.py `verify_broker`). Uncomment to
# require the broker's per-tool shared secret. Provision the SAME value in both places:
#   - the secret backend, under the field below (toolyard injects it as broker_secret)
#   - the broker's env: TOOLSTACK_TOOL_SECRET_ECHO=<value> (broker sends X-Toolstack-Secret)
# Then a process that merely guesses this tool's port can't call it directly.
# [[secrets]]
# name = "broker_secret"
# field = "ECHO_BROKER_SECRET"
